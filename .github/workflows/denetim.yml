name: Denetim

on:
  push:
    branches: [main]
  pull_request:

jobs:
  denetim:
    # Playwright 1.56, Ubuntu 26.04'ü desteklemiyor; sürüm yükseltilene kadar 24.04'te koşar.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Parça dosyaları geçerli mi
        run: python3 araclar/parca.py --denetle
      - name: Parçalar kaynak notalarla aynı mı
        run: python3 araclar/kaynak_denetle.py
      - name: Üretilen dosyalar güncel mi
        run: python3 araclar/derle.py --denetle
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Testler
        run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-sonuclari
          path: test-results/
          retention-days: 7
